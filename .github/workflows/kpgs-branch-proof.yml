name: KPGS Comfort Branch Proof

on:
  push:
    branches:
      - feat/canonical-progressive-comfort
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Execute repository acceptance build
        run: npm run build
